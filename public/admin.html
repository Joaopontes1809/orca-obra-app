<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orça Obra</title>
<meta name="theme-color" content="#F8FAFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orça Obra">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <img src="/icons/icon-192.png" alt="">
      <div>
        <div class="brand-name-row">
          <p class="brand-name" id="company-name">Sua Construtora</p>
          <button class="edit-name" id="btn-edit-name" aria-label="Editar nome da empresa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          </button>
        </div>
        <p class="brand-sub">Painel de orçamentos</p>
      </div>
      <div class="brand-actions">
        <button class="btn btn-sm" id="btn-share-link">Link p/ cliente</button>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-tab="pendentes">Pendentes<span class="nav-badge" id="badge-pendentes" hidden>0</span></button>
      <button class="nav-item" data-tab="confirmados">Confirmados</button>
      <button class="nav-item" data-tab="agenda">Agenda</button>
      <button class="nav-item" data-tab="catalogo">Catálogo</button>
      <button class="nav-item" data-tab="stats">Estatística</button>
    </nav>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <img src="/icons/icon-192.png" alt="">
      <div>
        <p class="brand-name" id="company-name-side">Sua Construtora</p>
        <p class="brand-sub">Painel de orçamentos</p>
      </div>
    </div>
    <button class="sidebar-item active" data-tab="pendentes">Pendentes<span class="nav-badge" id="badge-pendentes-side" hidden>0</span></button>
    <button class="sidebar-item" data-tab="confirmados">Confirmados</button>
    <button class="sidebar-item" data-tab="agenda">Agenda</button>
    <button class="sidebar-item" data-tab="catalogo">Catálogo</button>
    <button class="sidebar-item" data-tab="stats">Estatística</button>
    <div class="sidebar-foot"><button class="btn btn-block" id="btn-share-link-side">Link p/ cliente</button></div>
  </aside>

  <main class="content">
    <section id="tab-pendentes" class="tab active"></section>
    <section id="tab-confirmados" class="tab"></section>

    <section id="tab-agenda" class="tab">
      <h2 class="section">Calendário</h2>
      <div id="agenda-view"></div>
    </section>

    <section id="tab-catalogo" class="tab">
      <div class="section-head">
        <h2 class="section">Tipos de serviço</h2>
        <button class="btn btn-primary btn-sm" id="btn-add-service">+ Novo serviço</button>
      </div>
      <div id="cat-services"></div>

      <div class="section-head">
        <h2 class="section">Materiais</h2>
        <button class="btn btn-primary btn-sm" id="btn-add-material">+ Novo material</button>
      </div>
      <div id="cat-materials"></div>
    </section>

    <section id="tab-stats" class="tab"></section>
  </main>

  <aside class="detail-panel" id="detail-panel"></aside>
</div>

<div class="overlay" id="item-overlay">
  <div class="modal">
    <h3>Adicionar item</h3>
    <div class="field">
      <label>Serviço</label>
      <select id="im-service"></select>
    </div>
    <div class="field">
      <label>Material</label>
      <div style="display:flex;gap:8px;">
        <select id="im-material" style="flex:1;"></select>
        <button type="button" class="btn btn-sm" id="im-search-price" title="Pesquisar preço na internet" style="flex-shrink:0;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label>Descrição (opcional)</label>
      <input id="im-desc" placeholder="Ex: Piso da sala">
    </div>
    <div class="row3">
      <div class="field">
        <label id="im-qty-label">Quantidade (m²)</label>
        <input id="im-qty" type="number" inputmode="decimal" placeholder="0" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Preço unit. (€)</label>
        <input id="im-price" type="number" inputmode="decimal" placeholder="0,00" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Mão de obra (%)</label>
        <input id="im-labor" type="number" inputmode="decimal" placeholder="0" min="0" step="1">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="im-cancel">Cancelar</button>
      <button class="btn btn-primary" id="im-confirm">Adicionar</button>
    </div>
  </div>
</div>

<!-- Modal Novo Serviço -->
<div class="overlay" id="service-overlay">
  <div class="modal">
    <h3 id="service-modal-title">Novo serviço</h3>
    <div class="field">
      <label>Nome</label>
      <input id="svc-name" placeholder="Ex: Gesso, Impermeabilização">
    </div>
    <div class="row2">
      <div class="field">
        <label>Unidade</label>
        <input id="svc-unit" placeholder="m²" value="m²">
      </div>
      <div class="field">
        <label>Mão de obra padrão (%)</label>
        <input id="svc-labor" type="number" inputmode="decimal" placeholder="50" min="0" step="1" value="50">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="svc-cancel">Cancelar</button>
      <button class="btn btn-primary" id="svc-confirm">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Novo Material -->
<div class="overlay" id="material-overlay">
  <div class="modal">
    <h3 id="material-modal-title">Novo material</h3>
    <div class="field">
      <label>Nome do material</label>
      <input id="mat-name" placeholder="Ex: Telha cerâmica 40x40">
    </div>
    <div class="field">
      <label>Serviço associado</label>
      <select id="mat-service"></select>
    </div>
    <div class="row2">
      <div class="field">
        <label>Unidade</label>
        <input id="mat-unit" placeholder="m²">
      </div>
      <div class="field">
        <label>Preço unitário (€)</label>
        <input id="mat-price" type="number" inputmode="decimal" placeholder="0,00" min="0" step="0.01">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="mat-cancel">Cancelar</button>
      <button class="btn btn-primary" id="mat-confirm">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Evento Agenda -->
<div class="overlay" id="agenda-overlay">
  <div class="modal">
    <h3 id="agenda-modal-title">Novo evento</h3>
    <div class="field">
      <label>Título</label>
      <input id="agenda-title" placeholder="Ex: Visita técnica, Início da obra">
    </div>
    <div class="row2">
      <div class="field">
        <label>Data</label>
        <input id="agenda-date" type="date">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="agenda-type">
          <option value="visita">Visita</option>
          <option value="obra">Início obra</option>
          <option value="entrega">Entrega material</option>
          <option value="reuniao">Reunião</option>
          <option value="outro">Outro</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Pedido relacionado (opcional)</label>
      <select id="agenda-pedido">
        <option value="">— Nenhum —</option>
      </select>
    </div>
    <div class="field">
      <label>Nota</label>
      <textarea id="agenda-note" placeholder="Observações..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="agenda-cancel">Cancelar</button>
      <button class="btn btn-primary" id="agenda-confirm">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="detail-overlay">
  <div class="modal" id="detail-modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<div class="fab-row" id="fab-confirmados">
  <button class="btn btn-primary btn-block" id="btn-novo-orcamento">+ Novo orçamento</button>
</div>

<script src="/js/shared.js"></script>
<script>
let catalog = { services: [], materials: [] };
let companyName = 'Sua Construtora';
let pedidos = [];
let agenda = [];
let activeTab = 'pendentes';
let draftItems = [];
let editingPedidoId = null;
let itemModalTargetIsDraft = false;
let editingServiceId = null;
let editingMaterialId = null;
let editingAgendaId = null;

const ECRA_LARGO = '(min-width: 1280px)';

// Qual pedido esta aberto no detalhe, e como o voltar a desenhar quando a
// largura muda de lado do ponto de rutura.
let detalheAbertoId = null;
let detalheAbertoTipo = null; // 'pendente' | 'confirmado'

function ecraLargo(){
  return window.matchMedia(ECRA_LARGO).matches;
}

function reabrirDetalhe(){
  if(detalheAbertoId == null) return;
  if(detalheAbertoTipo === 'pendente') openPendingDetail(detalheAbertoId);
  else openConfirmedDetail(detalheAbertoId);
}

// Mesmo conteudo, contentor diferente conforme o espaco disponivel.
function mostrarDetalhe(html){
  const painel = document.getElementById('detail-panel');
  const overlay = document.getElementById('detail-overlay');
  const modal = document.getElementById('detail-modal-content');
  if(ecraLargo()){
    overlay.classList.remove('open');
    modal.innerHTML = '';
    painel.innerHTML = html;
    return painel;
  }
  painel.innerHTML = '';
  modal.innerHTML = html;
  overlay.classList.add('open');
  return modal;
}

function fecharDetalhe(){
  detalheAbertoId = null;
  detalheAbertoTipo = null;
  document.getElementById('detail-overlay').classList.remove('open');
  document.getElementById('detail-modal-content').innerHTML = '';
  document.getElementById('detail-panel').innerHTML = detalheVazio();
  document.querySelectorAll('.card-selected').forEach(c => c.classList.remove('card-selected'));
}

function detalheVazio(){
  return `<div class="empty"><p>Escolha um pedido para ver o orçamento.</p></div>`;
}

if(typeof window.matchMedia === 'function'){
  window.matchMedia(ECRA_LARGO).addEventListener('change', reabrirDetalhe);
}

/* ---------------- API ---------------- */
async function loadAll(){
  const [cfgR, listR, agR] = await Promise.allSettled([
    apiGet('/api/config'), apiGet('/api/pedidos'), apiGet('/api/agenda')
  ]);
  const falhas = [];

  if(cfgR.status === 'fulfilled'){
    const cfg = cfgR.value || {};
    catalog = cfg.catalogo || { services:[], materials:[] };
    companyName = (cfg.empresa && cfg.empresa.nome) || 'Sua Construtora';
  } else { falhas.push('catálogo'); }

  if(listR.status === 'fulfilled'){ pedidos = listR.value || []; }
  else { falhas.push('pedidos'); }

  if(agR.status === 'fulfilled'){ agenda = agR.value || []; }
  else { falhas.push('agenda'); }

  ['company-name', 'company-name-side'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.textContent = companyName;
  });
  renderAll();

  if(falhas.length){ showToast('Não foi possível carregar: ' + falhas.join(', ')); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ---------------- tabs ---------------- */
document.querySelectorAll('[data-tab]').forEach(btn=>{
  btn.addEventListener('click', ()=>switchTab(btn.dataset.tab));
});
function switchTab(name){
  activeTab = name;
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('active', s.id==='tab-'+name));
  document.getElementById('fab-confirmados').style.display = (name==='confirmados') ? 'block' : 'none';
  if(name === 'agenda') loadAgendaPedidos();
}

document.getElementById('btn-edit-name').addEventListener('click', async ()=>{
  const name = prompt('Nome da empresa:', companyName);
  if(name && name.trim()){
    companyName = name.trim();
    ['company-name', 'company-name-side'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.textContent = companyName;
    });
    try{ await apiSend('/api/config/empresa', 'PUT', { nome: companyName }); showToast('Nome atualizado'); }
    catch(e){ showToast('Erro ao guardar nome'); }
  }
});

['btn-share-link', 'btn-share-link-side'].forEach(id => {
  const btn = document.getElementById(id);
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    const link = window.location.origin + '/pedido';
    if(navigator.share){
      navigator.share({ title:'Pedir orçamento', url: link }).catch(()=>{});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(link).then(()=>showToast('Link copiado: '+link)).catch(()=>{
        prompt('Copie o link para enviar aos clientes:', link);
      });
    } else {
      prompt('Copie o link para enviar aos clientes:', link);
    }
  });
});

/* ---------------- calc ---------------- */
function calcItem(it){
  const materialCost = (it.quantity||0) * (it.unitPrice||0);
  const laborCost = materialCost * ((it.laborPercent||0)/100);
  return { materialCost, laborCost, total: materialCost + laborCost };
}
function calcTotals(items){
  return (items||[]).reduce((acc,it)=>{
    const c = calcItem(it);
    acc.material += c.materialCost; acc.labor += c.laborCost; acc.total += c.total;
    return acc;
  }, {material:0, labor:0, total:0});
}
function calcExtras(p){
  const extras = p.extras || [];
  return extras.reduce((s,e)=> s + (parseFloat(e.valor)||0), 0);
}

/* ---------------- render root ---------------- */
function renderAll(){
  renderPendentes();
  renderConfirmados();
  renderAgenda();
  renderCatalogView();
  renderStats();
  if(detalheAbertoId == null){
    document.getElementById('detail-panel').innerHTML = detalheVazio();
  }
  document.getElementById('fab-confirmados').style.display = (activeTab==='confirmados') ? 'block' : 'none';
}

/* ---------------- pendentes ---------------- */
function renderPendentes(){
  const el = document.getElementById('tab-pendentes');
  const list = pedidos.filter(p=>p.status==='pendente');
  ['badge-pendentes', 'badge-pendentes-side'].forEach(id => {
    const badgeEl = document.getElementById(id);
    if(!badgeEl) return;
    badgeEl.textContent = list.length;
    badgeEl.hidden = list.length === 0;
  });

  if(list.length===0){
    el.innerHTML = `<div class="empty">
      <h2>Nenhum pedido pendente</h2>
      <p>Partilhe o link de pedido de orçamento com os clientes — os pedidos aparecem aqui automaticamente.</p>
    </div>`;
    return;
  }
  el.innerHTML = `<div class="list">${list.map(p=>{
    const t = calcTotals(p.itens);
    const services = [...new Set((p.itens||[]).map(it=>{
      const s = catalog.services.find(s=>s.id===it.serviceId);
      return s ? s.name : null;
    }).filter(Boolean))];
    const servicos = services.length ? services : (p.tipo_servico ? [p.tipo_servico] : []);
    return `<article class="card card-clickable" data-id="${p.id}">
      <div class="card-top">
        <div>
          <h3>${escapeHtml(p.nome_cliente || 'Sem nome')}</h3>
          <p class="dim">${escapeHtml(p.morada || '')}${p.telefone ? ' · ' + escapeHtml(p.telefone) : ''}</p>
        </div>
        ${t.total > 0 ? `<span class="money">~${fmt(t.total)}</span>` : ''}
      </div>
      <div class="card-tags">
        ${servicos.map(s => `<span class="tag tag-pend">${escapeHtml(s)}</span>`).join('')}
      </div>
      ${p.descricao ? `<p class="card-desc dim">${escapeHtml(p.descricao)}</p>` : ''}
    </article>`;
  }).join('')}</div>`;
  el.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>openPendingDetail(parseInt(card.dataset.id)));
  });
}

function openPendingDetail(id){
  const p = pedidos.find(p=>p.id===id);
  if(!p) return;
  detalheAbertoId = id;
  detalheAbertoTipo = 'pendente';
  document.querySelectorAll('.card-selected').forEach(c => c.classList.remove('card-selected'));
  const cartao = document.querySelector(`.card[data-id="${id}"]`);
  if(cartao) cartao.classList.add('card-selected');

  const t = calcTotals(p.itens);
  const itemsHtml = (p.itens||[]).length ? (p.itens||[]).map(it=>{
    const c = calcItem(it);
    return `<div class="item-row">
      <div>
        <div class="desc">${escapeHtml(it.desc)}</div>
        <div class="sub">${it.quantity} ${escapeHtml(it.unit||'')}${it.unitPrice ? ' × '+fmt(it.unitPrice) : ' · a definir'}</div>
      </div>
      <div class="val num">${it.unitPrice ? fmt(c.total) : '—'}</div>
    </div>`;
  }).join('') : '';
  const html = `
    <h3>${escapeHtml(p.nome_cliente||'Pedido')}</h3>
    <p class="sub-h">Recebido em ${fmtDate(p.created_at)}</p>
    <div class="info-grid">
      <div class="box"><div class="k">Telefone</div><div class="v">${escapeHtml(p.telefone)||'—'}</div></div>
      <div class="box"><div class="k">Tipo de trabalho</div><div class="v">${escapeHtml(p.tipo_servico)||'—'}</div></div>
      <div class="box full"><div class="k">Morada</div><div class="v">${escapeHtml(p.morada)||'—'}</div></div>
      <div class="box full"><div class="k">Descrição do cliente</div><div class="v">${escapeHtml(p.descricao)||'—'}</div></div>
      ${p.observacoes_cliente ? `<div class="box full"><div class="k">Observações</div><div class="v">${escapeHtml(p.observacoes_cliente)}</div></div>` : ''}
    </div>
    ${itemsHtml ? `
      <h2 class="section">Trabalhos pedidos pelo cliente</h2>
      ${itemsHtml}
      <div class="total-box">
        <div class="final"><span class="lbl">Estimativa vista pelo cliente</span><span class="num amt">${fmt(t.total)}</span></div>
      </div>
    ` : ''}
    <div class="modal-actions">
      <button class="btn btn-danger" id="pd-recusar">Recusar</button>
      <button class="btn btn-ghost" id="pd-fechar">Fechar</button>
      <button class="btn btn-primary" id="pd-confirmar">Confirmar e assumir</button>
    </div>
  `;
  const container = mostrarDetalhe(html);
  container.querySelector('#pd-fechar').addEventListener('click', ()=>fecharDetalhe());
  container.querySelector('#pd-recusar').addEventListener('click', async ()=>{
    if(!confirm('Recusar este pedido? Esta ação não pode ser desfeita.')) return;
    try{
      await apiSend('/api/pedidos/'+id, 'DELETE');
      pedidos = pedidos.filter(x=>x.id!==id);
      fecharDetalhe();
      renderPendentes();
      showToast('Pedido recusado');
    }catch(e){ showToast('Erro ao recusar pedido'); }
  });
  container.querySelector('#pd-confirmar').addEventListener('click', async ()=>{
    try{
      const updated = await apiSend('/api/pedidos/'+id, 'PATCH', {
        status:'confirmado',
        nome_orcamento: p.tipo_servico ? (p.tipo_servico+' — '+p.nome_cliente) : p.nome_cliente
      });
      pedidos = pedidos.map(x => x.id === id ? updated : x);
      renderAll();
      if(!ecraLargo()) switchTab('confirmados');
      openConfirmedDetail(id);
      showToast('Pedido confirmado — pode agora montar o orçamento');
    }catch(e){ showToast('Erro ao confirmar pedido'); }
  });
}

/* ---------------- confirmados ---------------- */
function renderConfirmados(){
  const el = document.getElementById('tab-confirmados');
  const list = pedidos.filter(p=>p.status==='confirmado').sort((a,b)=> new Date(b.confirmado_em||b.created_at) - new Date(a.confirmado_em||a.created_at));
  if(list.length===0){
    el.innerHTML = `<div class="empty">
      <h2>Nenhum orçamento confirmado</h2>
      <p>Confirme um pedido pendente ou toque em "+ Novo orçamento" para criar um diretamente.</p>
    </div>`;
    return;
  }
  el.innerHTML = `<div class="list">${list.map(p=>{
    const t = calcTotals(p.itens);
    const extra = calcExtras(p);
    const realTotal = t.total + extra;
    const services = [...new Set((p.itens||[]).map(it=>{
      const s = catalog.services.find(s=>s.id===it.serviceId);
      return s ? s.name : null;
    }).filter(Boolean))];
    return `<article class="card card-clickable" data-id="${p.id}">
      <div class="card-top">
        <div>
          <h3>${escapeHtml(p.nome_orcamento || p.nome_cliente || 'Orçamento')}</h3>
          <p class="dim">${escapeHtml(p.nome_cliente || '')}${p.morada ? ' · ' + escapeHtml(p.morada) : ''}</p>
        </div>
        <span class="money">${fmt(realTotal)}</span>
      </div>
      <div class="card-tags">
        ${services.map(s => `<span class="tag tag-ok">${escapeHtml(s)}</span>`).join('')}
      </div>
    </article>`;
  }).join('')}</div>`;
  el.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>openConfirmedDetail(parseInt(card.dataset.id)));
  });
}

function openConfirmedDetail(id){
  const p = pedidos.find(p=>p.id===id);
  if(!p) return;
  editingPedidoId = id;
  draftItems = JSON.parse(JSON.stringify(p.itens||[]));
  itemModalTargetIsDraft = true;
  detalheAbertoId = id;
  detalheAbertoTipo = 'confirmado';
  document.querySelectorAll('.card-selected').forEach(c => c.classList.remove('card-selected'));
  const cartao = document.querySelector(`.card[data-id="${id}"]`);
  if(cartao) cartao.classList.add('card-selected');

  const t = calcTotals(draftItems);
  const html = `
    <h3>Orçamento</h3>
    <p class="sub-h">${p.nome_cliente ? escapeHtml(p.nome_cliente) : 'Cliente não indicado'}${p.morada ? ' · '+escapeHtml(p.morada) : ''}</p>
    <div class="field"><label>Nome do orçamento</label><input id="ed-nome" value="${escapeHtml(p.nome_orcamento||'')}" placeholder="Ex: Reforma cozinha"></div>
    <div class="row2">
      <div class="field"><label>Cliente</label><input id="ed-cliente" value="${escapeHtml(p.nome_cliente||'')}"></div>
      <div class="field"><label>Telefone</label><input id="ed-telefone" value="${escapeHtml(p.telefone||'')}"></div>
    </div>
    <div class="field"><label>Morada</label><input id="ed-morada" value="${escapeHtml(p.morada||'')}"></div>
    <div class="field">
      <label>Observações internas</label>
      <textarea id="ed-obs" placeholder="Notas da equipa, prazos, acordos combinados...">${escapeHtml(p.observacoes_internas||'')}</textarea>
      <button type="button" class="btn btn-sm" id="ed-ai-assist" style="margin-top:8px;border-color:var(--accent);color:var(--accent);">✦ Sugerir com IA</button>
      <p class="search-status" id="ed-ai-status" style="font-size:12px;color:var(--text-faint);margin-top:6px;"></p>
    </div>

    <h2 class="section">Itens do orçamento</h2>
    <div id="ed-items"></div>
    <button class="btn btn-block" id="ed-add-item" style="margin-top:6px;">+ Adicionar item</button>

    <h2 class="section">Custos adicionais</h2>
    <p style="color:var(--text-faint);font-size:12.5px;margin:-6px 0 10px 2px;">Materiais novos, ajudantes, mão de obra extra — tudo que não está nos itens acima.</p>
    <div id="ed-extras"></div>
    <button class="btn btn-block" id="ed-add-extra" style="margin-top:6px;background:var(--accent-soft);border-color:var(--border-strong);color:var(--accent);">+ Adicionar custo extra</button>

    <div class="total-box">
      <div class="line"><span>Material (itens)</span><span class="num" id="ed-tot-material">${fmt(t.material)}</span></div>
      <div class="line"><span>Mão de obra (itens)</span><span class="num" id="ed-tot-mao">${fmt(t.labor)}</span></div>
      <div class="line"><span>Custos adicionais</span><span class="num" id="ed-tot-extra">${fmt(calcExtras(p))}</span></div>
      <div class="final"><span class="lbl">Total</span><span class="num amt" id="ed-tot-final">${fmt(t.total + calcExtras(p))}</span></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-danger" id="ed-delete">Excluir</button>
      <button class="btn btn-ghost" id="ed-close">Fechar</button>
      <button class="btn btn-primary" id="ed-save">Guardar</button>
    </div>
  `;
  const container = mostrarDetalhe(html);
  renderEditItems();
  renderEditExtras();

  container.querySelector('#ed-ai-assist').addEventListener('click', async ()=>{
    const statusEl = container.querySelector('#ed-ai-status');
    const btn = container.querySelector('#ed-ai-assist');
    btn.disabled = true;
    statusEl.textContent = 'A gerar sugestão...';
    try{
      const data = await apiSend('/api/ai/assist-admin', 'POST', {
        descricao: p.descricao, observacoes_cliente: p.observacoes_cliente,
        tipo_servico: p.tipo_servico, services: catalog.services
      });
      const obsEl = container.querySelector('#ed-obs');
      if(data.resumo && !obsEl.value.trim()){ obsEl.value = data.resumo; }
      else if(data.resumo){ obsEl.value = obsEl.value + '\n\n[IA] ' + data.resumo; }

      let added = 0;
      (data.itens_sugeridos||[]).forEach(sug=>{
        const s = catalog.services.find(sv=>sv.name.toLowerCase()===String(sug.servico||'').toLowerCase());
        if(!s) return;
        const already = draftItems.some(it=>it.serviceId===s.id);
        if(already) return;
        const matGuess = (sug.material||'').toLowerCase();
        let mat = null;
        if(matGuess){
          mat = catalog.materials.find(m=>m.serviceId===s.id && (m.name.toLowerCase().includes(matGuess) || matGuess.includes(m.name.toLowerCase().split(' ')[0])));
        }
        draftItems.push({
          id: uid(), serviceId: s.id, materialId: mat ? mat.id : null,
          desc: mat ? mat.name : (sug.material || s.name+' — a definir'),
          quantity: sug.quantidade || 0, unit: s.unit,
          unitPrice: mat ? mat.price : 0, laborPercent: s.laborPercent
        });
        added++;
      });
      renderEditItems();
      statusEl.textContent = added>0 ? `Sugestão aplicada — ${added} item(ns) adicionados para rever.` : 'Sugestão de observações aplicada.';
    }catch(e){
      statusEl.textContent = 'Não foi possível gerar sugestão agora.';
    }
    btn.disabled = false;
  });

  container.querySelector('#ed-add-item').addEventListener('click', ()=>openItemModal());
  container.querySelector('#ed-add-extra').addEventListener('click', ()=>{
    const p = pedidos.find(x=>x.id===editingPedidoId);
    const nome = prompt('Nome do custo (ex: Cimento extra, Ajudante João):');
    if(!nome || !nome.trim()) return;
    const tipo = prompt('Tipo (material / ajudante / mao_de_obra_extra / outro):', 'material') || 'outro';
    const valor = parseFloat(prompt('Valor (€):', '0')) || 0;
    if(!p.extras) p.extras = [];
    p.extras.push({ id: uid(), nome: nome.trim(), tipo: tipo.trim(), valor });
    renderEditExtras();
    updateEditTotals();
    showToast('Custo adicionado');
  });
  container.querySelector('#ed-close').addEventListener('click', ()=>{ fecharDetalhe(); editingPedidoId=null; });
  container.querySelector('#ed-delete').addEventListener('click', async ()=>{
    if(!confirm('Excluir este orçamento? Esta ação não pode ser desfeita.')) return;
    try{
      await apiSend('/api/pedidos/'+id, 'DELETE');
      pedidos = pedidos.filter(x=>x.id!==id);
      fecharDetalhe();
      editingPedidoId = null;
      renderAll();
      showToast('Orçamento excluído');
    }catch(e){ showToast('Erro ao excluir'); }
  });
  container.querySelector('#ed-save').addEventListener('click', async ()=>{
    try{
      const p = pedidos.find(x=>x.id===editingPedidoId);
      const updated = await apiSend('/api/pedidos/'+id, 'PATCH', {
        nome_orcamento: document.getElementById('ed-nome').value.trim(),
        nome_cliente: document.getElementById('ed-cliente').value.trim(),
        telefone: document.getElementById('ed-telefone').value.trim(),
        morada: document.getElementById('ed-morada').value.trim(),
        observacoes_internas: document.getElementById('ed-obs').value.trim(),
        itens: draftItems,
        extras: p.extras || []
      });
      pedidos = pedidos.map(x=>x.id===id ? updated : x);
      fecharDetalhe();
      editingPedidoId = null;
      renderAll();
      showToast('Orçamento guardado');
    }catch(e){ showToast('Erro ao guardar orçamento'); }
  });
}

function renderEditItems(){
  const el = document.getElementById('ed-items');
  if(!el) return;
  if(draftItems.length===0){
    el.innerHTML = `<p style="color:var(--text-faint);font-size:13.5px;margin:6px 0 0 2px;">Nenhum item adicionado ainda.</p>`;
  } else {
    el.innerHTML = draftItems.map((it, idx)=>{
      const c = calcItem(it);
      const s = catalog.services.find(s=>s.id===it.serviceId);
      return `<div class="item-row">
        <div>
          <div class="desc">${escapeHtml(it.desc || (s?s.name:'Item'))}</div>
          <div class="sub">${it.quantity} ${escapeHtml(it.unit||'')} × ${fmt(it.unitPrice)} + ${it.laborPercent}%</div>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="val num">${fmt(c.total)}</div>
          <button class="del" data-idx="${idx}">×</button>
        </div>
      </div>`;
    }).join('');
    el.querySelectorAll('.del').forEach(b=>{
      b.addEventListener('click', ()=>{
        draftItems.splice(parseInt(b.dataset.idx),1);
        renderEditItems();
        updateEditTotals();
      });
    });
  }
  updateEditTotals();
}
function updateEditTotals(){
  const t = calcTotals(draftItems);
  const m = document.getElementById('ed-tot-material');
  if(!m) return;
  const p = pedidos.find(x=>x.id===editingPedidoId);
  const extraTotal = calcExtras(p);
  document.getElementById('ed-tot-material').textContent = fmt(t.material);
  document.getElementById('ed-tot-mao').textContent = fmt(t.labor);
  document.getElementById('ed-tot-extra').textContent = fmt(extraTotal);
  document.getElementById('ed-tot-final').textContent = fmt(t.total + extraTotal);
}

/* ---------------- custos extras (materiais novos, ajudantes...) ---------------- */
function renderEditExtras(){
  const p = pedidos.find(x=>x.id===editingPedidoId);
  if(!p) return;
  const extras = p.extras || [];
  const el = document.getElementById('ed-extras');
  if(!el) return;
  if(extras.length===0){
    el.innerHTML = `<p style="color:var(--text-faint);font-size:13.5px;margin:6px 0 0 2px;">Nenhum custo extra adicionado ainda.</p>`;
  } else {
    el.innerHTML = extras.map((e, idx)=>`
      <div class="item-row">
        <div>
          <div class="desc">${escapeHtml(e.nome || 'Custo')}</div>
          <div class="sub">${escapeHtml(e.tipo || 'outro')}</div>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="val num">${fmt(parseFloat(e.valor)||0)}</div>
          <button class="del" data-extra-idx="${idx}">×</button>
        </div>

/* ---------------- item modal (compartilhado) ---------------- */
const itemOverlay = document.getElementById('item-overlay');
const imService = document.getElementById('im-service');
const imMaterial = document.getElementById('im-material');

function populateServiceSelect(){
  imService.innerHTML = catalog.services.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
}
function populateMaterialSelect(){
  const sid = imService.value;
  const mats = catalog.materials.filter(m=>m.serviceId===sid);
  imMaterial.innerHTML = mats.map(m=>`<option value="${m.id}">${escapeHtml(m.name)} — ${fmt(m.price)}/${m.unit}</option>`).join('')
    + `<option value="__custom__">Outro material (definir preço)</option>`;
  applyMaterialDefaults();
}
function applyMaterialDefaults(){
  const s = catalog.services.find(s=>s.id===imService.value);
  const mat = catalog.materials.find(m=>m.id===imMaterial.value);
  document.getElementById('im-qty-label').textContent = `Quantidade (${s?s.unit:'un'})`;
  document.getElementById('im-labor').value = s ? s.laborPercent : 0;
  document.getElementById('im-price').value = mat ? mat.price : '';
}
imService.addEventListener('change', populateMaterialSelect);
imMaterial.addEventListener('change', applyMaterialDefaults);

function openItemModal(){
  populateServiceSelect();
  populateMaterialSelect();
  document.getElementById('im-desc').value='';
  document.getElementById('im-qty').value='';
  itemOverlay.classList.add('open');
}
document.getElementById('im-cancel').addEventListener('click', ()=>itemOverlay.classList.remove('open'));

document.getElementById('im-search-price').addEventListener('click', ()=>{
  let name = '';
  if(imMaterial.value === '__custom__'){
    const s = catalog.services.find(s=>s.id===imService.value);
    name = document.getElementById('im-desc').value.trim() || (s ? s.name : '');
  } else {
    const opt = imMaterial.options[imMaterial.selectedIndex];
    name = opt ? opt.textContent.split(' — ')[0] : '';
  }
  if(!name){ showToast('Escolha ou descreva o material primeiro'); return; }
  window.open('https://www.google.com/search?tbm=shop&q='+encodeURIComponent(name+' preço comprar'), '_blank');
});

document.getElementById('im-confirm').addEventListener('click', ()=>{
  const qty = parseFloat(document.getElementById('im-qty').value);
  const price = parseFloat(document.getElementById('im-price').value);
  const labor = parseFloat(document.getElementById('im-labor').value);
  if(!qty || qty<=0){ showToast('Informe a quantidade'); return; }
  if(isNaN(price) || price<0){ showToast('Informe o preço unitário'); return; }
  const s = catalog.services.find(s=>s.id===imService.value);
  draftItems.push({
    id: uid(), serviceId: imService.value,
    materialId: imMaterial.value==='__custom__' ? null : imMaterial.value,
    desc: document.getElementById('im-desc').value.trim(),
    quantity: qty, unit: s ? s.unit : '', unitPrice: price,
    laborPercent: isNaN(labor) ? 0 : labor
  });
  itemOverlay.classList.remove('open');
  renderEditItems();
});

      </button>
      <button class="del" data-mat-del="${m.id}">×</button>
    </div>`;
  }).join('');

  svcEl.querySelectorAll('.svc-labor').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const s = catalog.services.find(s=>s.id===inp.dataset.svc);
      s.laborPercent = parseFloat(inp.value)||0;
      await saveCatalog(); showToast('Serviço atualizado');
    });
  });
  svcEl.querySelectorAll('[data-svc-del]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      catalog.services = catalog.services.filter(s=>s.id!==b.dataset.svcDel);
      await saveCatalog(); renderCatalogView();
    });
  });
  svcEl.querySelectorAll('[data-svc-edit]').forEach(b=>{
    b.addEventListener('click', ()=>openServiceModal(b.dataset.svcEdit));
  });
  matEl.querySelectorAll('.mat-price').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const m = catalog.materials.find(m=>m.id===inp.dataset.mat);
      m.price = parseFloat(inp.value)||0;
      await saveCatalog(); showToast('Preço atualizado');
    });
  });
  matEl.querySelectorAll('[data-mat-search]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const m = catalog.materials.find(m=>m.id===b.dataset.matSearch);
      if(m) window.open('https://www.google.com/search?tbm=shop&q='+encodeURIComponent(m.name+' preço comprar'), '_blank');
    });
  });
  matEl.querySelectorAll('[data-mat-del]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      catalog.materials = catalog.materials.filter(m=>m.id!==b.dataset.matDel);
      await saveCatalog(); renderCatalogView();
    });
  });
  matEl.querySelectorAll('[data-mat-edit]').forEach(b=>{
    b.addEventListener('click', ()=>openMaterialModal(b.dataset.matEdit));
  });
}

/* ---------------- agenda (calendário) ---------------- */
const TIPO_AGENDA = {
  visita:  { label:'Visita',        color:'#2563eb', bg:'rgba(37,99,235,0.10)' },
  obra:    { label:'Início obra',   color:'#16a34a', bg:'rgba(22,163,74,0.10)' },
  entrega: { label:'Entrega material', color:'#d97706', bg:'rgba(217,119,6,0.10)' },
  reuniao: { label:'Reunião',       color:'#7c3aed', bg:'rgba(124,58,237,0.10)' },
  outro:   { label:'Outro',         color:'#64748b', bg:'rgba(100,116,139,0.10)' }
};

async function loadAgendaPedidos(){
  const sel = document.getElementById('agenda-pedido');
  if(!sel) return;
  const opts = ['<option value="">— Nenhum —</option>']
    .concat(pedidos.map(p=>{
      const label = `${p.nome_cliente || 'Cliente'} — ${p.nome_orcamento || (p.tipo_servico || 'Pedido #'+p.id)}`;
      return `<option value="${p.id}">${escapeHtml(label)}</option>`;
    }));
  sel.innerHTML = opts.join('');
}

function agendaGrouped(){
  const sorted = [...agenda].sort((a,b)=> (a.data||'').localeCompare(b.data||''));
  const groups = {};
  sorted.forEach(ev=>{
    const key = ev.data || 'sem-data';
    (groups[key] = groups[key] || []).push(ev);
  });
  return Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));
}

function renderAgenda(){
  const el = document.getElementById('agenda-view');
  if(!el) return;
  if(agenda.length===0){
    el.innerHTML = `<div class="empty">
      <div class="empty-icon" style="font-size:40px;">📅</div>
      <p class="lead">Sem eventos agendados</p>
      <p>Organize visitas, obras e reuniões no calendário.</p>
      <button class="btn btn-primary" id="agenda-empty-add" style="margin-top:8px;">+ Adicionar evento</button>
    </div>`;
    const add = document.getElementById('agenda-empty-add');
    if(add) add.addEventListener('click', ()=>openAgendaModal(null));
    return;
  }

  const groups = agendaGrouped();
  el.innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button class="btn btn-primary btn-sm" id="agenda-add">+ Adicionar evento</button>
    </div>
    ${groups.map(([data, evs])=>`
      <div class="agenda-day">
        <div class="agenda-date">${fmtAgendaDate(data)}</div>
        <div class="agenda-events">
          ${evs.map(ev=>{
            const t = TIPO_AGENDA[ev.tipo] || TIPO_AGENDA.outro;
            const pedido = ev.pedidoId ? pedidos.find(p=>String(p.id)===String(ev.pedidoId)) : null;
            return `<div class="agenda-card" data-agenda="${ev.id}" style="cursor:pointer;">
              <span class="chip" style="color:${t.color};background:${t.bg};">${t.label}</span>
              <div class="agenda-body">
                <div class="agenda-title">${escapeHtml(ev.titulo || 'Evento')}</div>
                ${pedido ? `<div class="agenda-sub">📋 ${escapeHtml(pedido.nome_cliente || 'Cliente')}</div>` : ''}
                ${ev.nota ? `<div class="agenda-sub">${escapeHtml(ev.nota)}</div>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `).join('')}
  `;

  const addBtn = document.getElementById('agenda-add');
  if(addBtn) addBtn.addEventListener('click', ()=>openAgendaModal(null));
  el.querySelectorAll('[data-agenda]').forEach(c=>{
    c.addEventListener('click', ()=>openAgendaModal(c.dataset.agenda));
  });
}

function fmtAgendaDate(data){
  if(data==='sem-data' || !data) return 'Sem data';
  const d = new Date(data + 'T00:00:00');
  if(isNaN(d)) return data;
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today)/86400000);
  let rel = '';
  if(diff===0) rel = ' · Hoje';
  else if(diff===1) rel = ' · Amanhã';
  else if(diff===-1) rel = ' · Ontem';
  return d.toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'long'}) + rel;
}

const agendaOverlay = document.getElementById('agenda-overlay');

function openAgendaModal(id){
  editingAgendaId = id || null;
  // o id vem de dataset.agenda, que e sempre texto; o da base de dados e numero
  const ev = id ? agenda.find(x=>String(x.id)===String(id)) : null;
  document.getElementById('agenda-modal-title').textContent = ev ? 'Editar evento' : 'Novo evento';
  document.getElementById('agenda-title').value = ev ? (ev.titulo||'') : '';
  document.getElementById('agenda-date').value = ev ? (ev.data||'') : new Date().toISOString().slice(0,10);
  document.getElementById('agenda-type').value = ev ? (ev.tipo||'outro') : 'visita';
  loadAgendaPedidos().then(()=>{
    document.getElementById('agenda-pedido').value = ev ? (ev.pedidoId||'') : '';
  });
  document.getElementById('agenda-note').value = ev ? (ev.nota||'') : '';
  agendaOverlay.classList.add('open');
}

document.getElementById('agenda-cancel').addEventListener('click', ()=>agendaOverlay.classList.remove('open'));
document.getElementById('agenda-confirm').addEventListener('click', async ()=>{
  const titulo = document.getElementById('agenda-title').value.trim();
  const data = document.getElementById('agenda-date').value;
  const tipo = document.getElementById('agenda-type').value;
  const pedidoId = document.getElementById('agenda-pedido').value || null;
  const nota = document.getElementById('agenda-note').value.trim();
  if(!titulo){ showToast('Informe o título'); return; }
  if(!data){ showToast('Informe a data'); return; }

  try{
    if(editingAgendaId){
      const body = { titulo, data, tipo, pedidoId, nota };
      const updated = await apiSend('/api/agenda/'+editingAgendaId, 'PATCH', body);
      agenda = agenda.map(a=>a.id===editingAgendaId ? updated : a);
      showToast('Evento atualizado');
    } else {
      const created = await apiSend('/api/agenda', 'POST', { titulo, data, tipo, pedidoId, nota });
      agenda.unshift(created);
      showToast('Evento adicionado');
    }
    agendaOverlay.classList.remove('open');
    renderAgenda();
  }catch(e){ showToast('Erro ao guardar evento'); }
});

/* ---------------- estatisticas ---------------- */
function renderStats(){
  const el = document.getElementById('tab-stats');
  const total = pedidos.length;
  const pendentesCount = pedidos.filter(p=>p.status==='pendente').length;
  const confirmados = pedidos.filter(p=>p.status==='confirmado');
  const confirmadosCount = confirmados.length;
  const taxa = total>0 ? Math.round((confirmadosCount/total)*100) : 0;

  let valorTotal = 0;
  let totalMaterial = 0;
  let totalMao = 0;
  let totalExtras = 0;
  confirmados.forEach(p=>{
    const t = calcTotals(p.itens);
    totalMaterial += t.material;
    totalMao += t.labor;
    totalExtras += calcExtras(p);
    valorTotal += t.total + calcExtras(p);
  });
  const ticketMedio = confirmadosCount>0 ? valorTotal/confirmadosCount : 0;

  const porServico = {};
  confirmados.forEach(p=>{
    (p.itens||[]).forEach(it=>{
      const s = catalog.services.find(s=>s.id===it.serviceId);
      const name = s ? s.name : 'Outro';
      porServico[name] = (porServico[name]||0) + calcItem(it).total;
    });
  });
  const servicoEntries = Object.entries(porServico).sort((a,b)=>b[1]-a[1]);
  const maxServico = servicoEntries.length ? servicoEntries[0][1] : 0;

  if(total===0){
    el.innerHTML = `<div class="empty">
      <img class="empty-icon" src="/icons/icon-192.png" alt="">
      <p class="lead">Ainda sem dados</p>
      <p>As estatísticas aparecem aqui assim que houver pedidos e orçamentos confirmados.</p>
    </div>`;
    return;
  }

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="num-big">${total}</div><div class="lbl">Pedidos recebidos</div></div>
      <div class="stat-box"><div class="num-big">${confirmadosCount}</div><div class="lbl">Confirmados</div></div>
      <div class="stat-box"><div class="num-big">${pendentesCount}</div><div class="lbl">Pendentes</div></div>
      <div class="stat-box"><div class="num-big">${taxa}%</div><div class="lbl">Taxa de confirmação</div></div>
      <div class="stat-box" style="grid-column:1/-1;"><div class="num-big">${fmt(valorTotal)}</div><div class="lbl">Valor total confirmado</div></div>
      <div class="stat-box" style="grid-column:1/-1;background:var(--bg-soft);">
        <div class="breakdown">
          <div class="bd-row"><span>Material (itens)</span><span class="num">${fmt(totalMaterial)}</span></div>
          <div class="bd-row"><span>Mão de obra (itens)</span><span class="num">${fmt(totalMao)}</span></div>
          <div class="bd-row"><span>Custos adicionais</span><span class="num">${fmt(totalExtras)}</span></div>
        </div>
      </div>
      <div class="stat-box" style="grid-column:1/-1;"><div class="num-big">${fmt(ticketMedio)}</div><div class="lbl">Valor médio por orçamento confirmado</div></div>
    </div>
    ${servicoEntries.length ? `
      <h2 class="section">Valor por tipo de serviço</h2>
      ${servicoEntries.map(([name,val])=>`
        <div class="bar-row">
          <div class="bar-top"><span>${escapeHtml(name)}</span><span class="n num">${fmt(val)}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${maxServico>0 ? (val/maxServico*100) : 0}%"></div></div>
        </div>
      `).join('')}
    ` : ''}
  `;
}

loadAll();
</script>
